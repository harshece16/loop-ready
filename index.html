<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Loop Ready</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23CFD4DD' stroke-width='5'/%3E%3Cpath d='M16 5a11 11 0 0 1 9.5 16.5' fill='none' stroke='%232B4EFF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#F6F7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0C10" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&display=swap">
<style>
/* The same tokens as the site: white ground, blue-black ink, one blue. */
:root { --bg: #FFFFFF; --rail: #F6F7FA; --ink: #0D1321; --muted: #4F596C; --line: #E3E6EC; --line-2: #CFD4DD; --accent: #2B4EFF; --bad: #BE3329; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E1116; --rail: #0A0C10; --ink: #EEF1F6; --muted: #9AA4B5; --line: #232934; --line-2: #333B4A; --accent: #8FA2FF; --bad: #F08A80; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--rail); color: var(--ink); font: 400 1rem/1.5 "Mona Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
form { width: 100%; max-width: 23rem; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 1.75rem; display: grid; gap: 1rem; }
h1 { display: flex; align-items: center; gap: 0.6rem; margin: 0; font-size: 1.35rem; font-weight: 800; font-stretch: 114%; letter-spacing: -0.02em; }
h1 svg { width: 1.8rem; height: 1.8rem; }
p { margin: 0; color: var(--muted); font-size: 0.95rem; }
input[type=password] { width: 100%; padding: 0.7rem 0.8rem; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, label { touch-action: manipulation; }
label { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; color: var(--muted); }
button { padding: 0.75rem; font: 650 1rem "Mona Sans", system-ui, sans-serif; color: var(--bg); background: var(--ink); border: 0; border-radius: 12px; cursor: pointer; }
button:hover { background: var(--accent); }
button:disabled { opacity: 0.6; cursor: wait; }
#msg { min-height: 1.4em; color: var(--bad); font-size: 0.9rem; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="var(--line-2)" stroke-width="5"/><path d="M16 5a11 11 0 0 1 9.5 16.5" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg>Loop Ready</h1>
  <p>This site is private. Enter the passphrase to open it.</p>
  <input type="password" id="pw" name="passphrase" autocomplete="current-password" aria-label="Passphrase" required>
  <label><input type="checkbox" id="keep" checked> Remember on this device</label>
  <button id="go">Open</button>
  <p id="msg" role="alert"></p>
</form>
<script>
(() => {
  const SALT = "Ly5lTvluc0mCjLh+18zLug==", ITER = 600000, KEY = "loop-ready-key";
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = fetch("site.enc", { cache: "no-cache" }).then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error("download failed")));

  async function decrypt(key) {
    const buf = new Uint8Array(await enc);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  async function derive(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  function ask(text) { $("f").hidden = false; $("msg").textContent = text || ""; $("pw").focus(); }

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    $("go").disabled = true; $("msg").textContent = "";
    try {
      const keep = $("keep").checked, key = await derive($("pw").value), html = await decrypt(key);
      if (keep) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (err) { /* storage blocked */ }
      }
      show(html);
      return;
    } catch (err) {
      $("go").disabled = false;
      ask(err.name === "OperationError" ? "That passphrase did not work." : "The site could not load. Check your connection and try again.");
    }
  });

  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
  if (!saved) { ask(); return; }
  crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(decrypt).then(show).catch(err => {
    if (err.name !== "OperationError" && err.name !== "DataError") { ask("The site could not load. Check your connection and reload."); return; }
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }  // passphrase changed since it was saved
    ask();
  });
})();
</script>
</body>
</html>
