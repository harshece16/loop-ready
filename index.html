<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Loop Ready</title>
<style>
:root { --bg: #EEF1F0; --surface: #FFFFFF; --ink: #131A1F; --muted: #56636B; --line: #D3DADB; --accent: #2148C9; --bad: #B4322A; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E1316; --surface: #151C20; --ink: #E3E8EA; --muted: #95A2AA; --line: #29343A; --accent: #8EA7FF; --bad: #F08A80; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem; display: grid; gap: 0.9rem; }
h1 { margin: 0; font-size: 1.4rem; }
h1 span { color: var(--accent); }
p { margin: 0; color: var(--muted); font-size: 0.92rem; }
input[type=password] { width: 100%; padding: 0.6rem 0.7rem; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
label { display: flex; gap: 0.5rem; align-items: center; font-size: 0.92rem; color: var(--muted); }
button { padding: 0.6rem; font: 600 1rem system-ui, sans-serif; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
#msg { min-height: 1.4em; color: var(--bad); }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Loop<span>Ready</span></h1>
  <p>This site is private. Enter the passphrase to open it.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Passphrase" required>
  <label><input type="checkbox" id="keep" checked> Remember on this device</label>
  <button id="go">Open</button>
  <p id="msg" role="alert"></p>
</form>
<script>
(() => {
  const SALT = "Ly5lTvluc0mCjLh+18zLug==", ITER = 600000, KEY = "loop-ready-key";
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = fetch("site.enc", { cache: "no-cache" }).then(r => r.ok ? r.arrayBuffer() : Promise.reject(new Error("download failed")));

  async function decrypt(key) {
    const buf = new Uint8Array(await enc);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  async function derive(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  function ask(text) { $("f").hidden = false; $("msg").textContent = text || ""; $("pw").focus(); }

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    $("go").disabled = true; $("msg").textContent = "";
    try {
      const keep = $("keep").checked, key = await derive($("pw").value), html = await decrypt(key);
      if (keep) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (err) { /* storage blocked */ }
      }
      show(html);
      return;
    } catch (err) {
      $("go").disabled = false;
      ask(err.name === "OperationError" ? "That passphrase did not work." : "The site could not load. Check your connection and try again.");
    }
  });

  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
  if (!saved) { ask(); return; }
  crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(decrypt).then(show).catch(err => {
    if (err.name !== "OperationError" && err.name !== "DataError") { ask("The site could not load. Check your connection and reload."); return; }
    try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }  // passphrase changed since it was saved
    ask();
  });
})();
</script>
</body>
</html>
